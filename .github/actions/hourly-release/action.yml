name: Hourly release
description: >-
  At most once an hour, release-please writes the release commit for everything on main, and it lands on main's head
  as a GitHub-signed fast-forward, with no release pull request to merge. A later run tags it and publishes the GitHub
  Release once that commit's own CI run passed, so commits pushed after it never hold the release back.
inputs:
  token:
    description: Token that can write main and the release branch; its GitHub Release starts the deploy workflows.
    required: true
  ci-workflow:
    description: File name of the workflow that tests every push to main, for example ci.yaml (one component).
    default: ""
  tag-prefix:
    description: Release tag prefix, for example frontend-v, or v for a repo with one component.
    default: ""
  components:
    description: >-
      Several components, as JSON keyed by manifest path, in place of ci-workflow and tag-prefix:
      {"ios": {"tag-prefix": "ios-v", "statuses": ["ui-works/iphone"], "latest": true},
      ".": {"tag-prefix": "worker-v", "ci-workflows": ["worker-ci.yml"]}}. A release commit tags each component whose
      version it changed once that component's workflows (push runs) and commit statuses passed on it, or on a later
      commit on main that holds it; the others wait or are skipped.
    default: ""
  config-file:
    description: release-please config file.
    default: release-please-config.json
  manifest-file:
    description: release-please manifest file.
    default: .release-please-manifest.json
outputs:
  release_created:
    description: "'true' when this run published a release."
    value: ${{ steps.publish.outputs.release_created }}
  tag_name:
    description: The tag this run published (the last one, with several components).
    value: ${{ steps.publish.outputs.tag_name }}
  tags:
    description: Every tag this run published, separated by spaces.
    value: ${{ steps.publish.outputs.tags }}
  html_url:
    description: The GitHub Release this run published.
    value: ${{ steps.publish.outputs.html_url }}
runs:
  using: composite
  steps:
    # A release commit on main waits for its own CI run: passed, tag it; failed, skip that version; running, wait.
    - id: ready
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        CI_WORKFLOW: ${{ inputs.ci-workflow }}
        TAG_PREFIX: ${{ inputs.tag-prefix }}
        COMPONENTS: ${{ inputs.components }}
        MANIFEST: ${{ inputs.manifest-file }}
      run: '"$GITHUB_ACTION_PATH/hourly-release.sh" ready'

    # Tags over git and creates the GitHub Release with no target commit: on 2026-11-15 GitHub's REST API answered 404 to
    # any release or ref that named an older commit, so release-please's own tagging failed.
    - id: publish
      if: steps.ready.outputs.state == 'ready'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        SHA: ${{ steps.ready.outputs.sha }}
        PR_NUMBER: ${{ steps.ready.outputs.number }}
        READY: ${{ steps.ready.outputs.components }}
        FINAL: ${{ steps.ready.outputs.final }}
        TAG_PREFIX: ${{ inputs.tag-prefix }}
        COMPONENTS: ${{ inputs.components }}
        MANIFEST: ${{ inputs.manifest-file }}
        CONFIG_FILE: ${{ inputs.config-file }}
      run: '"$GITHUB_ACTION_PATH/hourly-release.sh" publish'

    - id: decide
      if: steps.ready.outputs.state == 'none'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        TAG_PREFIX: ${{ inputs.tag-prefix }}
        COMPONENTS: ${{ inputs.components }}
      run: '"$GITHUB_ACTION_PATH/hourly-release.sh" decide'

    - id: prepare
      if: steps.decide.outputs.go == 'true'
      uses: googleapis/release-please-action@v4
      with:
        token: ${{ inputs.token }}
        config-file: ${{ inputs.config-file }}
        manifest-file: ${{ inputs.manifest-file }}
        target-branch: main
        skip-github-release: true

    - id: land
      if: steps.decide.outputs.go == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        # The pull request release-please just opened or updated; GitHub's search lags behind it.
        PR: ${{ steps.prepare.outputs.pr }}
      run: '"$GITHUB_ACTION_PATH/hourly-release.sh" land'
