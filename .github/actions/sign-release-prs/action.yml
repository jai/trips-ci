name: Sign release PRs
description: Rebuild release-please PR heads as GitHub-signed commits, because main only accepts verified commits.
inputs:
  prs:
    description: The prs output of googleapis/release-please-action.
    required: true
  token:
    description: Token that can write the PR branch and trigger its checks.
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        PRS: ${{ inputs.prs }}
        GH_TOKEN: ${{ inputs.token }}
      run: '"$GITHUB_ACTION_PATH/sign-release-prs.sh"'
