name: Sign release PRs
description: Rebuild open release-please PRs as GitHub-signed commits, because main only accepts verified commits, then enroll them in auto-merge.
inputs:
  token:
    description: Token that can write the PR branch and trigger its checks.
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
      run: '"$GITHUB_ACTION_PATH/sign-release-prs.sh"'
